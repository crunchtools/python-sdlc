# This repo ships no Python package: `sdlc` is a standalone
# script run by path inside the image, the same arrangement
# crunchtools/constitution uses for its validators. This file exists to
# CONFIGURE the linters, which Gourmand's IF001 requires and which was a fair
# finding -- the repo had Python files and no ruff configuration, so they were
# being linted by hand with the image rather than by a gate.
#
# `version` must equal the newest released CHANGELOG heading: the constitution's
# version-sync rule checks this file.

[project]
name = "sdlc"
version = "0.16.1"
description = "One container image and one script for every CrunchTools Python SDLC check"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"

# What the uv-driven checks of `sdlc push` load from THIS repo's lock rather
# than from the image: mypy and pytest run in the project environment, and
# PyYAML is the one third-party import the scripts make. A group, not an extra,
# because there is no package to hang an extra on; uv syncs `dev` by default.
[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    # `sdlc pytest` runs `-n` when the lock has it: the suites run side by side.
    "pytest-xdist>=3.8",
    "pyyaml>=6.0",
    # sdlc_jobs/_app_token.py signs the Ashigaru App's JWT with it; the image
    # carries the same pin for `write`. The tests sign with a fake.
    "pyjwt[crypto]>=2.10",
    # Pinned to a release past the fleet's 7-day cooldown.
    "types-pyyaml==6.0.12.20261113",
]

[tool.mypy]
python_version = "3.14"
# `sdlc` has no .py extension, so mypy would name it
# `__main__`; this names it after its file instead.
scripts_are_modules = true
# What `sdlc push` checks when it runs mypy bare. tests/ is not here yet: the
# suites load `sdlc` through importlib, so mypy sees a module of Any.
files = ["sdlc", "scripts", "sdlc_jobs"]

# sdlc_jobs/_gatehouse_shim.py runs under gatehouse's own interpreter in the
# image (/app/venv/bin/python), the only place gatehouse is installed.
[[tool.mypy.overrides]]
module = ["gatehouse", "gatehouse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suites are scripts that check at import; tests/test_suites.py runs each
# as its own process, so it is the only file pytest collects.
python_files = ["test_suites.py"]

[tool.ruff]
line-length = 100
# The version the image bakes. Kept equal to the ruff hook's rev below and to
# RUFF_VERSION in the Containerfile -- a repo whose formatter disagrees with its
# own gate is the drift this project exists to delete.
target-version = "py314"
# Semgrep's rule fixtures are the bad code each rule must catch, on purpose.
extend-exclude = [".semgrep/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "PIE", "PT",
          "RET", "SIM", "TID", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
    "TRY003",  # exception messages are built at the raise site, as in trentina
    "S603",    # subprocess without shell=True is the whole point of this tool
    "S607",    # tools are invoked by name, resolved from the image's PATH
]

# Gourmand's IF001 requires explicit thresholds rather than ruff's implicit
# defaults, so that raising one is a visible decision. Matched to trentina's.
[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Starting tools IS this script's job, and `/tmp` is a tmpfs the launcher mounts
# explicitly (sized, exec, mode 1777) rather than a guess at a writable path.
# ARG001: every target takes `cfg` so TARGETS can dispatch them uniformly; three
# of them have no settings to read, and a signature that varies per target would
# be worse than an unused parameter.
"sdlc" = ["S404", "S108", "ARG001"]
# A test asserts. That is what it is for.
# S302: test_pycache_prefix.py unmarshals bytecode to show what pytest's
# assertion rewriter sees. The input is a .pyc that test compiled itself,
# seconds earlier, into its own temporary directory -- there is no untrusted
# bytecode anywhere near it, and reading it any other way would not be a copy
# of the behaviour under test.
"tests/*" = ["S101", "PT018", "S302"]
# Its fixtures are the fleet's files byte for byte, long lines included: the
# script matches the pinned CI step exactly, so a wrapped copy tests nothing.
"tests/test_convert_repo.py" = ["S101", "E501"]
# The sdlc_jobs suites assert counts as the numbers they are, and hand the jobs
# fake credentials ("tok", a fake App key) so nothing real is ever near a test.
"tests/test_event_*.py" = ["S101", "PLR2004", "S105", "S106"]
"tests/fake_github.py" = ["S101", "PLR2004", "S105", "S106"]

[tool.sdlc]
# What this repository is, for the constitution's v2 check (section K). A CLI,
# `sdlc`, whose exit codes are its contract (K3), shipped as the one image the
# fleet pins (K6).
repo-kinds = ["cli-tool", "container-image"]
