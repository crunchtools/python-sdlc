# This repo's own gates.
#
# The classic fleet shape, not sdlc's own two hooks: this repo builds the
# image, so gating it on that image is circular on a first clone. Constitution
# XII (v1.30.0) exempts it by name (`sdlc_exempt`), with gourmand and gatehouse.
#
# No container build at pre-push: that is minutes, and Scott's rule is that a
# push never waits on one. CI builds the image and runs the contract test
# against the pushed digest.

default_install_hook_types: [pre-commit, pre-merge-commit, pre-push]

repos:
  # ruff from its own pre-commit environment, at the SAME version the image
  # bakes (Containerfile RUFF_VERSION and pyproject.toml target-version). The
  # repo had Python files and no ruff gate until Gourmand's IF001 said so.
  #
  # `args` and `pass_filenames: false` because `sdlc` and `validate` have no
  # .py extension, so ruff's default file selection does not see them.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix, sdlc, validate, tests, scripts]
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
      - id: ruff-format
        args: [sdlc, validate, tests, scripts]
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (bin/sdlc, the tests and scripts)
        entry: podman --events-backend=none run --rm --log-driver=none -v .:/mnt:ro,z -w /mnt docker.io/koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d bin/sdlc tests/contract.sh tests/test_host_contract.sh tests/test_container_stack.sh scripts/release-version.sh scripts/revision-of.sh tests/test_revision_of.sh bin/sdlc-bootstrap tests/test_bootstrap.sh scripts/sign-digest.sh tests/test_sign_digest.sh .semgrep/run-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

      # Pure host work, no image needed, so it belongs at commit.
      - id: host-contract
        name: bin/sdlc needs only git, podman, pre-commit and gh
        entry: tests/test_host_contract.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

  # Fleet-owned wiring from crunchtools/gatehouse/examples/pre-commit.yaml per
  # constitution XII. The tags float, with `--pull=newer`, as XV rule 5 asks
  # from v1.60.0 on. They were exact once, because podman's default `missing`
  # never refreshed a cached `:latest` and trentina's local Gatehouse ran two
  # weeks stale. `--pull=newer` closes that hole without a pin to bump.
  #
  # One deviation, for the reason bin/sdlc's run_in_image states: `z`, not
  # `Z`. `Z` relabels the worktree with a category pair private to one
  # container, taking it out from under every other container that mounts the
  # same tree -- including a plain `-v .:/mnt:ro` in another hook or workflow
  # step, which then cannot read the repo at all. It cost half an hour here.
  # These three hooks mount one tree, so they share the label.
  #
  # The fleet example should change the same way; raised separately.
  # `--events-backend=none --log-driver=none` keeps a gate out of the journal.
  - repo: local
    hooks:
      - id: gourmand
        name: Gourmand (AI slop detection)
        entry: podman --events-backend=none run --rm --log-driver=none --pull=newer -v .:/src:z -w /src quay.io/crunchtools/gourmand:main check --full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]

      - id: gatehouse
        name: Gatehouse (AI code review, staged diff)
        entry: bash -c 'git diff --cached | podman --events-backend=none run --rm --log-driver=none --pull=newer -i --env-file "$HOME/.config/mcp-env/gatehouse.env" -v .:/src:ro,z -w /src quay.io/crunchtools/gatehouse:latest --stdin'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-merge-commit]
