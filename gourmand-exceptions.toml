# Justified exceptions to Gourmand's checks, in the fleet's format.
#
# NOTE: gourmand.toml beside this file is REQUIRED. Gourmand locates this file
# relative to its config, so without a gourmand.toml every exception here is
# silently not loaded and reports as an unexcepted violation. That cost an
# afternoon to find, because nothing says the file was ignored.

# Manifest lint suppression. Gourmand treats every ruff `ignore` and
# `per-file-ignores` entry as a suppression, and is right to: it is a policy
# decision that should be argued once rather than repeated quietly. One entry
# covering the file, as trentina does, because the argument is one argument.
[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = """
  Every entry was checked by emptying the list and reading the real hits, and \
  what could be fixed in the code was fixed rather than ignored: CannotRun \
  became CannotRunError (N818), the exit codes became named constants instead \
  of literal 2s (PLR2004), path_ignored was split so neither half is over the \
  complexity threshold (C901), two function-level imports moved to the top \
  (PLC0415), and an exec(compile(...)) in the glob test became an importlib \
  load, which removed a dangerous API and the lint suppression that had been \
  hiding it. What remains is three package-wide and six scoped, and each one \
  is a rule this tool's job makes inapplicable rather than a rule being \
  dodged. Package-wide: S603 and S607, because starting pinned tools without a \
  shell IS the function -- every argv list is literals plus a path git \
  reported, and shell=True is never used; TRY003, because each message names \
  the specific file, lockfile entry or config path that could not be read, and \
  the exit-2 contract depends on those being specific enough to act on \
  (trentina made the same call). Scoped: S404 on the two scripts that must \
  import subprocess; S108 on sdlc, where /tmp is not a guess at a writable \
  path but an explicit tmpfs bin/sdlc mounts (sized, exec, mode 1777) because \
  the repo is read-only for most targets; ARG001 on sdlc, where every target \
  takes cfg so one dispatch table can call them uniformly and three have no \
  settings to read; S101 and PT018 under tests/, because a test asserts; \
  PLR2004, S105 and S106 on the sdlc_jobs suites and their fake, which assert \
  counts as the numbers they are and hand the jobs fake credentials so that \
  nothing real is ever near a test. No \
  threshold is raised anywhere and no check is disabled -- \
  [tool.ruff.lint.pylint] and [tool.ruff.lint.mccabe] are set to the fleet's \
  values explicitly so that raising one would be a visible change.
"""
classification = "by_design"

# The image layout, not a guess. sdlc_jobs runs only inside the sdlc image,
# whose Containerfile puts Ashigaru's scripts and the constitution's scripts
# at these paths; the tests point the module attributes at fixtures.
[[exceptions]]
check = "CH001-absolute_paths"
path = "sdlc_jobs/_tools.py"
classification = "by_design"
justification = """
  ASHIGARU_SCRIPTS, CONSTITUTION_SCRIPTS and CONSTITUTION_TEXT name where the \
  sdlc image's Containerfile installs the code and text the jobs use, the \
  same way sdlc names \
  /repo and /cache. They are module attributes, not environment toggles, so \
  a run cannot be pointed at other code by a variable (design: no variable \
  chooses code), and tests patch the attributes to fixtures.
"""

# Revoking the App token is cleanup after the step's work has succeeded.
[[exceptions]]
check = "EV004-redundant_error_handling"
path = "sdlc_jobs/_app_token.py"
classification = "by_design"
justification = """
  The DELETE /installation/token in app_token's finally block runs after the \
  step has already posted, pushed or tagged. A failed revoke is reported as a \
  ::warning:: and not raised because the token expires within the hour by \
  GitHub's design, and failing the job here would mark `write` failed after \
  its work landed, so a re-run would post the same review twice. The handler \
  decides that outcome; it does not hide one.
"""

# GitHub is instantiated in ai.main and gate.main, and is Site's default
# api_for; nothing in the repo imports sdlc_jobs yet because the `sdlc event`
# dispatcher that calls each job's main lands in its own pull request.
[[exceptions]]
check = "DC004-dead_structs"
path = "sdlc_jobs/_github.py"
classification = "gourmand_bug"
justification = """
  GitHub is constructed in sdlc_jobs/ai.py's main and sdlc_jobs/gate.py's \
  main, and is the default api_for of _tools.Site, which write.py's main \
  builds. Those mains are entry points called by `sdlc event`, whose \
  dispatcher is a separate change, so no production module imports them yet \
  and the class looks test-only. It is the only HTTP client the jobs have.
"""

# A shape match, not a copy. gate._triage reads a PR's reviews, comments and
# commits and judges them; write's apply_fix resolves ids and runs
# fix_publish.py. They share a run of assign/call/return statements only.
[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/gate.py"
classification = "gourmand_bug"
justification = """
  gate._triage and write.Job.apply_fix share no line, call or identifier: \
  one pages a pull request's reviews, comments and commits and returns the \
  unanswered findings, the other checks the branch head, swaps pending \
  finding ids for real ones and runs Ashigaru's fix_publish.py. The match is \
  ten assignments and calls of similar length, the shape of most short \
  Python functions, so there is no shared helper to extract.
"""

# Three statements: run one of Ashigaru's scripts, check it, return what it
# set. ai's guard and write's publish_code call different scripts with
# different credentials; the shared shape is the one-line contract of
# _tools.ashigaru and _tools.checked, which are already the shared helpers.
[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/ai.py"
classification = "gourmand_bug"
justification = """
  Job.guard (guard.py, read token, ai) and write's Job.publish_code \
  (publish.py, App token, write) match on three statements: call \
  _tools.ashigaru, pass the result to _tools.checked, return an output. The \
  logic they share already lives in those two helpers; merging the callers \
  would put the read token and the App token behind one function, which the \
  ai/write split exists to prevent.
"""

[[exceptions]]
check = "EV001-lint_suppression"
path = "sdlc_jobs/_core.py"
classification = "by_design"
justification = """
  Two `noqa: S310` on Tools.http's Request and urlopen, both guarded by the \
  `startswith("https://")` refusal at the top of the same function. The \
  scheme is fixed to https before any URL reaches urllib, so the file:// and \
  custom-scheme risk S310 exists for is not reachable. Redirects must still \
  be followed (GitHub answers a renamed repo with one), which rules out \
  swapping to http.client.
"""

[[exceptions]]
check = "EV001-lint_suppression"
path = "sdlc_jobs/pypi.py"
classification = "by_design"
justification = """
  `noqa: S108` on the `--tmpfs /tmp:rw,exec,size=4g,mode=1777` argument of \
  the nested `uv build` container. S108 is about a program opening a \
  predictable file in the shared /tmp; here the string is a mount point \
  inside a fresh container with its own private tmpfs (sized, exec because \
  build backends run scripts from it), and HOME=/tmp points at the same \
  mount. The host's /tmp is never touched.
"""

[[exceptions]]
check = "CH001-absolute_paths"
path = "sdlc_jobs/image.py"
classification = "by_design"
justification = """
  RH_KEY and RH_REKOR are where Red Hat's release public key and Rekor \
  signing key are installed in gha-runner, the image this job runs in, and \
  the keyPath values of the skopeo policy.json the job writes for \
  registry.redhat.io. They are fixed, named once as module constants, and \
  asserted by tests/test_job_image.py; there is no config to move them to \
  because the file layout is the image's, not the repo's.
"""

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/image.py"
classification = "gourmand_bug"
justification = """
  The matches pair functions that share a silhouette (a few guards that call \
  cannot(), assignments, a loop, one return) and nothing else: run_gate \
  (runs a planned podman gate), build_and_push (the job's sequence), \
  pin_args (rewrites one FROM line), build (assembles podman build argv) and \
  run (sets up the scratch dir and Job). The real duplicates were extracted \
  into _core (final_stage, expand_build_vars, show); what is left shares no \
  line, call or identifier, so there is no helper to extract.
"""

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/_core.py"
classification = "gourmand_bug"
justification = """
  host_mount (inspects this container and maps the workspace to a host \
  path) is paired with image.build (assembles podman build argv): eleven \
  assign/if/loop statements of similar length, with no line, call or \
  identifier in common. Shape, not duplicated logic.
"""

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/check.py"
classification = "gourmand_bug"
justification = """
  run (reads the event, writes the plan, runs the gates) is paired with \
  release_plan (asks the API whether this push merged an Ashigaru release \
  PR): a run of assign/if/return statements of similar length with no line, \
  call or identifier in common. The real duplicates were extracted into \
  _core (final_stage, expand_build_vars, show) and the plan building was \
  split out of run; what is left is the shape of most short Python \
  functions, not copied logic.
"""

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/_verify_release.py"
classification = "gourmand_bug"
justification = """
  verify_release (re-derives a release from the GitHub API through seven \
  numbered tests) is paired with the entry-point functions of the other job \
  modules by statement count and shape alone: guards that call cannot(), \
  assignments, one return. It shares no line, call or identifier with them, \
  so there is no helper to extract.
"""

# A REST route, not a filesystem path.
[[exceptions]]
check = "CH001-absolute_paths"
path = "sdlc_jobs/renovate.py"
classification = "gourmand_bug"
justification = """
  The flagged literal is GitHub's REST route for a user by login, called through \
  the Api object to read the Renovate App's bot id for its commit author, the \
  same shape as every '/repos/...' route the other jobs call. The other \
  absolute paths, /work and /tmp, are mount points inside Renovate's nested \
  container (an anonymous volume and a private tmpfs), not paths on the \
  runner or in this job's container.
"""

[[exceptions]]
check = "EV001-lint_suppression"
path = "sdlc_jobs/renovate.py"
classification = "by_design"
justification = """
  `noqa: S108` on the `--tmpfs /tmp:rw,exec,size=1g,mode=1777` argument of \
  Renovate's nested container, the same case as pypi.py's: the string is a \
  mount point inside a fresh container with its own private tmpfs, and \
  HOME=/tmp points at it. The host's /tmp is never touched.
"""

[[exceptions]]
check = "EV001-lint_suppression"
path = "sdlc_jobs/ai.py"
classification = "by_design"
justification = """
  `noqa: S108` on MODEL_TMP, the `--tmpfs /tmp` of the model's sibling \
  container, the same case as renovate.py's: a mount point inside a fresh \
  container with its own private tmpfs, and HOME=/tmp points at it.
"""

[[exceptions]]
check = "CQ013-hardcoded_years"
path = "sdlc_jobs/_boot.py"
classification = "by_design"
justification = """
  MCP_PROTOCOL = "2025-06-18" is the Model Context Protocol revision the boot \
  gate asks for in `initialize`, an identifier the spec spells as a date, not \
  a year that goes stale. It is the revision container-release's gate sent, \
  so a converted repo is judged by the same handshake; moving it is a protocol \
  change to make on purpose, never a date to bump.
"""

[[exceptions]]
check = "CH001-absolute_paths"
path = "sdlc_jobs/_core.py"
classification = "by_design"
justification = """
own_container_id() reads this container's own mountinfo from proc and matches
the engine's bind mount of the hostname, hosts or resolv.conf file under etc
to find the container id (RT #1664). Those are fixed paths inside every job
container, named by the kernel and the engine, not paths of the host or the
repo, so there is nothing to make relative.
"""

# CQ002 reads the Keep a Changelog section names in the R4 fixtures as
# tombstone comments. They are test data: the check under test reads those
# headings, so the fixtures must spell them.
[[exceptions]]
check = "CQ002-dead_code_markers"
path = "tests/test_constitution.py"
classification = "gourmand_bug"
justification = """
  The R4 cases write CHANGELOG.md fixtures with a `### Deprecated` heading   and deprecation bullets, because check_release reads exactly that Keep a   Changelog section. The words are string data under test, not comments   marking removed code, and renaming them would test a heading no repo uses.
"""

[[exceptions]]
check = "CH001-absolute_paths"
path = "sdlc_jobs/boot.py"
classification = "by_design"
justification = """
  SDK_DIRS are the GitHub-hosted runner's preinstalled toolchains, the four \
  directories container-release's free-disk removed. They are paths on that \
  runner's host, mounted into a container of the job's own image to be \
  emptied, named once as a module constant and asserted by \
  tests/test_job_boot.py; the layout is the runner image's, not the repo's.
"""

# The same shape match: CH012 pairs boot.py's run with write.py's main,
# renovate.py's run and _release.py's: an event check, an env read, a
# workspace and a loop that returns early. No line, call or name is shared.
[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/boot.py"
classification = "gourmand_bug"
justification = """
  boot.run checks the event, refuses a held secret, re-validates image's \
  result and runs each image's shell; write.main, renovate.run and \
  _release's entry share no line, call or identifier with it. The match is \
  a run of twelve assign/if/return statements, the opening of every job \
  module's entry, not duplicated logic, so there is no helper to extract.
"""

# Copy-paste detection matches statement shape, not meaning, and both files
# are long runs of the same shape: fetch a value, check its type, refuse.
[[exceptions]]
check = "CH012-copy_paste_detection"
path = "scripts/convert_repo.py"
classification = "gourmand_bug"
justification = """
  What CH012 pairs is guard-clause shape, not logic. convert_hooks, \
  known_variants and same_gatehouse each read a parsed YAML mapping, check \
  isinstance on a key, and bail or rebuild a dict -- but over different \
  files (.pre-commit-config.yaml vs gatehouse.yml) and different keys, and a \
  shared helper would be a get-check-return wrapper that hides which field \
  each one refuses on. move_config matches _relock.shim and convert_workflows \
  matches promote.validate_image only as sequences of early refusals; they \
  share no data, no callers and no module, and sdlc_jobs is the image's code \
  while this script is a one-off repo converter that must not import it.
"""

[[exceptions]]
check = "CH012-copy_paste_detection"
path = "sdlc_jobs/promote.py"
classification = "gourmand_bug"
justification = """
  run, sign and plan_tags are matched on their shape -- a check, then \
  cannot(...) with a specific message, repeated -- which is how every job in \
  sdlc_jobs (_boot, renovate) validates its inputs, because the exit-2 \
  contract wants each refusal to name the exact input that failed. The \
  checks themselves differ: run validates the event and environment, sign \
  the key pair and signature, plan_tags the tag moves. Folding them into a \
  table-driven validator would trade a readable refusal per line for \
  indirection, and the convert_repo.py matches cross a deliberate boundary \
  (the image's jobs vs a standalone script).
"""
