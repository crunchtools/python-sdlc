# One time only: sdlc's first release under its own key (MODE=bootstrap in
# scripts/self.sh, docs/marketplace-free-ci.md). The release path's write job
# runs in sdlc-bootstrap, which verifies :<major>, so the first :<major> cannot
# come through it. Dispatched from main with the version whose vX.Y.Z tag
# release.yml cut at main's head; self.sh refuses once :<major> exists. The PR
# that installs sdlc's own ci.yml deletes this file.
name: Bootstrap
on:
  workflow_dispatch:
    inputs:
      version: { type: string, required: true }
permissions: {}
env: { COSIGN_IMAGE: "ghcr.io/sigstore/cosign/cosign@sha256:ad281047f85c5e1fc6ffbc30c2b55be3b07b4032bef715a12122ce5829619aca" }  # v2.6.5
jobs:
  approve:  # no secret; sdlc-approval's reviewers are the approval
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: sdlc-approval
    permissions: {}
    steps: [{ run: "true" }]
  image:  # builds both images from the tagged commit and pushes them gated, by digest
    needs: approve
    runs-on: ubuntu-latest
    environment: registry
    permissions: { contents: read }
    outputs: { result: "${{ steps.s.outputs.result }}" }
    env: { GITHUB_TOKEN: "${{ github.token }}", MODE: bootstrap, VERSION: "${{ inputs.version }}", APPROVED: "${{ needs.approve.result }}",
           SDLC_QUAY_USERNAME: "${{ secrets.SDLC_QUAY_USERNAME }}", SDLC_QUAY_PASSWORD: "${{ secrets.SDLC_QUAY_PASSWORD }}" }
    steps:
      - run: 'git init -q . && git fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" && git checkout -q FETCH_HEAD'
      - { id: s, run: scripts/self.sh }
  sign:  # the only job with the sdlc key: signs both digests and moves the tags
    needs: [approve, image]
    concurrency: { group: sdlc-sign }
    runs-on: ubuntu-latest
    environment: sdlc-signing
    permissions: { contents: read }
    env: { MODE: bootstrap, EVENT: "${{ github.event_name }}", BUILT: "${{ needs.image.outputs.result }}", APPROVED: "${{ needs.approve.result }}", VERSION: "${{ inputs.version }}",
           SDLC_KEY: "${{ secrets.SDLC_COSIGN_KEY }}", SDLC_KEY_PASSWORD: "${{ secrets.SDLC_COSIGN_PASSWORD }}",
           SDLC_QUAY_USERNAME: "${{ secrets.SDLC_QUAY_USERNAME }}", SDLC_QUAY_PASSWORD: "${{ secrets.SDLC_QUAY_PASSWORD }}" }
    steps:
      - run: 'git init -q . && git fetch -q --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA" && git checkout -q FETCH_HEAD'
      - run: scripts/self.sh
