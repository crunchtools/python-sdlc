# Two hooks, one per git moment. Which checks each one runs is decided by the
# consuming repo's pyproject.toml -- [tool.sdlc.commit] and [tool.sdlc.push] --
# and by the defaults in the image, never by this file. One list, in one place.
#
#   sdlc-commit   `sdlc commit`: seconds, offline, free -- formatting and lint
#                 fixes, and the check that the push hook is installed
#   sdlc-push     `sdlc push`: every verdict, once, over origin/<default>...HEAD;
#                 never a container build
#
# `language: script` because pre-commit resolves a script entry against this
# cloned repo and chdirs to the consumer's toplevel first, so `bin/sdlc` runs
# with the repo as $PWD. Not `language: docker_image`: that shells out to
# `docker`, and the host contract gives us podman.
#
# To skip one check for a false positive: SDLC_SKIP=gatehouse git push. The
# finding still has to be answered on the pull request.

- id: sdlc-commit
  name: sdlc commit
  description: Formatting and lint fixes, and the check that the push hook is installed.
  entry: bin/sdlc commit
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-commit, pre-merge-commit]

- id: sdlc-push
  name: sdlc push
  description: Every verdict, once, over the branch diff -- the checks CI runs.
  entry: bin/sdlc push
  language: script
  pass_filenames: false
  always_run: true
  stages: [pre-push]
