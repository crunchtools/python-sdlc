# Gatehouse findings this repo has judged, per Gatehouse 0.22.0's ledger.
#
# An entry applies only while the quote it names is still in the file, so a
# judgement dies with the code it covered rather than going on hiding the next
# defect in the same place. Gatehouse never writes this file; it prints entries
# ready to paste and a person supplies the reason.
#
# Everything else Gatehouse found on this repo's first review was fixed, not
# judged: the floating shellcheck/gourmand/gatehouse tags are now exact, `uv`
# joined the version report, the stale /src docstring says /repo,
# `paths-ignore` now honours globs (tests/test_codeql_globs.py), and the
# contract test's dispatch check now asserts something.

[[findings]]
agent = "constitution"
category = "constitution"
file = "Containerfile"
evidence = "FROM quay.io/hummingbird/python:3.14-builder"
status = "not-a-bug"
reason = """
Pinning the base by digest would break the weekly rebuild the Container Image \
profile requires. That profile mandates a `0 6 * * 1` cron whose whole purpose \
is picking up base-image errata, and mandates it bypass the layer cache, \
because a cached `dnf install` layer ships the same packages and no errata -- \
the ubi10-httpd-php incident of 2026-10-22, which shipped php 8.3.33 after the \
8.3.36 fix was available. A digest-pinned base makes that rebuild a no-op and \
freezes this image's OS packages at build time, which is strictly worse for a \
tooling image 35 repos pin. `3.14-builder` is a minor-version tag, not \
`latest`: it tracks 3.14 patches, which is exactly the surface the weekly \
rebuild is meant to move. The exact-pin rule is about the TOOLS whose verdicts \
this image produces, and all of those are pinned exactly -- the contract test \
asserts each reported version equals the version pinned at build time.
"""

[[findings]]
agent = "constitution"
category = "constitution"
file = "Containerfile"
evidence = "RUN dnf install -y git-core tar zstd which jq \\"
status = "not-a-bug"
reason = """
Same reasoning as the base-image finding above, and the same four unpinned \
neighbours: git-core, tar, zstd and which have never carried exact RPM \
versions on this line. The Container Image profile requires a weekly rebuild \
(`0 6 * * 1`) whose entire purpose is to pick up OS security updates; pinning \
an OS package to an exact version is how you build an image that stops \
receiving them, which is the opposite of what the cron is for. What the \
constitution pins to exact versions is the CHECK tools -- ruff, mypy, semgrep, \
pip-audit, CodeQL, Gourmand, Gatehouse -- because a verdict that changes under \
you is not a verdict; those are pinned by ARG and reported by `sdlc versions`. \
jq is not a check, it is part of the shell test toolbox, and its filter \
language is stable across every version the fleet ships. Pinning it would \
freeze a CVE-bearing RPM into the gate image for no gain in reproducibility \
that the digest-addressed release does not already provide.
"""

[[findings]]
agent = "constitution"
category = "constitution"
file = "bin/sdlc-bootstrap"
evidence = "image=${SDLC_IMAGE:-latest}\ncase $image in\n  */*) ;;\n  *) image=quay.io/crunchtools/sdlc:$image ;;"
status = "not-a-bug"
reason = """
Floating on :latest is the decision this file implements, not a slip: the \
fleet operator decided (a206) that nothing in a repo pins the launcher any \
more and that it floats with :latest exactly as the tools already do, so the \
conversion is the last fleet-wide pull-request wave. The pin moves from each \
repo to the release gate: only a tagged, contract-tested release moves \
:latest (container.yml promote), it never moves backwards, and a repo can hold \
a release back with the repository variable SDLC_IMAGE. The constitution's \
XII wording still describes the rev pin; amending it is the constitution \
repo's change, flagged with this work rather than made here.
"""

[[findings]]
agent = "constitution"
category = "constitution"
file = "bin/sdlc"
evidence = "gatehouse_skipped && return 0"
status = "not-a-bug"
reason = """
A skip here is a policy verdict, not a check that could not run. The fleet \
operator decided (a813) that Gatehouse must not send a diff to an external \
model unless the remote is a crunchtools repo on GitHub, so for any other \
remote there is nothing Gatehouse is meant to review. That is the same shape \
as `nothing to review: HEAD matches origin/main`, which already returns 0. \
Exit 2 would fail every such push and push people toward SDLC_SKIP, which is \
the workaround the contract forbids. The skip prints one loud line instead.
"""

[[findings]]
agent = "constitution"
category = "constitution"
file = "bin/sdlc-bootstrap"
evidence = "[ -z \"$seen\" ] || { mkdir -p \"$seen\" && : > \"$seen/$hex\"; } 2> /dev/null || :"
status = "not-a-bug"
reason = """
The verified-digest marker is not a check's cache and decides no verdict. \
It is written only after cosign has verified the digest, and the only thing \
it changes is whether a seat re-verifies that same digest next run. An \
unwritable cache means the seat verifies again next time, which is the safe \
direction; failing the gate on it would turn a read-only HOME into a gate \
that cannot run for no gain. CI never writes or reads it.
"""

[[findings]]
agent = "constitution"
category = "constitution"
file = "Containerfile"
evidence = "ARG NODE_MAJOR=24"
status = "not-a-bug"
reason = """
Node is this image's runtime for the node and docs stacks, not a tool whose \
verdict a repo pins, and it is pinned the way the base above pins Python to \
3.14: by the line the weekly errata rebuild is meant to move within. \
Hummingbird ships one nodejs24 build at a time and drops the one before, so an \
exact RPM pin would fail that rebuild the week after it was written. The exact \
version is not hidden: `sdlc versions` prints `node --version` beside the pin, \
and tests/contract.sh asserts the major. Every tool a check runs \
(markdownlint-cli2, lychee, hadolint, grype) is pinned exactly.
"""

