evidence = "return {\n    r[\"name\"]\n    for r in fleet(api)\n    if not refuse_private(r, include_private)\n    and is_converted(r[\"name\"], read_file(api, r[\"name\"], CI, r[\"default_branch\"]))\n}"
status = "not-a-bug"
reason = """
One contents read per repo of a 70-repo org is about 70 calls per run, run \
